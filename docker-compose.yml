services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podzemka}
      POSTGRES_USER: ${POSTGRES_USER:-podzemka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podzemka}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - podzemka-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-podzemka}:${POSTGRES_PASSWORD:-podzemka}@db:5432/${POSTGRES_DB:-podzemka}?sslmode=disable
    command: ["up"]

volumes:
  podzemka-postgres-data: